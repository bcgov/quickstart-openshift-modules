name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/actions/tree/main/builder
  builds:
    name: Builds
    permissions:
      attestations: write # Required for creating attestations
      contents: read # Required for repository access
      id-token: write # Required for OIDC token generation
      packages: write # Required for pushing images
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [backend-java, backend-py, migrations-py]
        include:
          - package: backend-java
            triggers: backend-java/
          - package: backend-py
            triggers: backend-py/
          - package: migrations-py
            triggers: backend-py/db
            build_context: ./backend-py/db
            build_file: ./backend-py/db/Dockerfile
    steps:
      - uses: bcgov/actions/builder@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        id: builds
        with:
          context: ${{ matrix.build_context }}
          file: ${{ matrix.build_file }}
          package: ${{ matrix.package }}
          tag_fallback: latest
          triggers: ${{ matrix.triggers }}

  deploys:
    name: Deploys (${{ github.event.number }})
    permissions:
      contents: read
    needs: [builds]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      oc_namespace: ${{ vars.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      target: ${{ github.event.number }}
      tag: ${{ github.event.pull_request.head.sha }}
      triggers: |
        backend-java/
        backend-py/
        common/
        integration-tests/
        .github/workflows/

  integration-unit:
    name: Integration Tests (unit)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integration-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: integration-tests/package-lock.json
      - run: npm ci
      - run: npm test

  integration-tests:
    name: Integration Tests (${{ matrix.name }})
    needs: [deploys]
    if: needs.deploys.outputs.triggered == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integration-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        name: [quarkus, fastapi]
        include:
          - name: quarkus
            baseUrl: https://${{ github.event.repository.name }}-${{ github.event.number }}-backend-java.apps.silver.devops.gov.bc.ca
          - name: fastapi
            baseUrl: https://${{ github.event.repository.name }}-${{ github.event.number }}-backend-py.apps.silver.devops.gov.bc.ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: integration-tests/package-lock.json
      - run: npm ci
      - name: Run integration tests
        env:
          BASE_URL: ${{ matrix.baseUrl }}
          API_NAME: ${{ matrix.name }}
        run: node src/main.js

  results:
    name: PR Results
    needs: [builds, deploys, integration-unit, integration-tests]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
