name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/actions/tree/main/builder
  builds:
    name: Builds
    permissions:
      attestations: write # Required for creating attestations
      contents: read # Required for repository access
      id-token: write # Required for OIDC token generation
      packages: write # Required for pushing images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend-java, backend-py, migrations-py]
        include:
          - package: backend-java
            triggers: ('backend-java/')
          - package: backend-py
            triggers: ('backend-py/')
          - package: migrations-py
            triggers: ('backend-py/db')
            build_context: ./backend-py/db
            build_file: ./backend-py/db/Dockerfile
    steps:
      - uses: bcgov/actions/builder@c4694d429e6c8025974ba383f6f26ff8a41f7755 # v0.7.1
        id: builds
        with:
          build_context: ${{ matrix.build_context }}
          build_file: ${{ matrix.build_file }}
          package: ${{ matrix.package }}
          tag_fallback: latest
          triggers: ${{ matrix.triggers }}

  deploys:
    name: Deploys (${{ github.event.number }})
    permissions:
      contents: read
    needs: [builds]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      oc_namespace: ${{ vars.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      target: ${{ github.event.number }}
      tag: ${{ github.event.pull_request.head.sha }}
      triggers: ('backend-java/' 'backend-py/' 'common/' '.github/workflows/')

  results:
    name: PR Results
    needs: [builds, deploys]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: bcgov/actions/workflow-results@c4694d429e6c8025974ba383f6f26ff8a41f7755 # v0.7.1
        with:
          needs: ${{ toJson(needs) }}
          title: "PR Results"
