name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"
      - ".graphics/**"
      - "!.github/workflows/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy; e.g. PR number or prod"
        type: string
        default: "prod"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Set Variables
    permissions:
      pull-requests: read # Required for action-get-pr to read PR information
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps: # Get PR number for squash merges to main
      - name: PR Number
        id: pr
        uses: bcgov/action-get-pr@3931962bf13b3f4702d0013ec7c836f752ff1a3b # v0.3.0

  deploy-test:
    name: Deploy (TEST)
    permissions:
      contents: read # Required for repository access
    needs: [vars]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      environment: test
      target: test
      tag: ${{ inputs.tag || needs.vars.outputs.pr }}

  integration-tests:
    name: Integration Tests for APIs
    needs: [deploy-test]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integration-tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        name: [quarkus, fastapi]
        include:
          - name: quarkus
            baseUrl: https://${{ github.event.repository.name }}-test-backend-java.apps.silver.devops.gov.bc.ca
          - name: fastapi
            baseUrl: https://${{ github.event.repository.name }}-test-backend-py.apps.silver.devops.gov.bc.ca
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integration-tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests
        run: BASE_URL=${{ matrix.baseUrl }} API_NAME=${{ matrix.name }} node src/main.js

  deploy-prod:
    name: Deploy (prod)
    permissions:
      contents: read # Required for repository access
    needs: [integration-tests, vars]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      db_password: ${{ secrets.db_password }}
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      environment: prod
      target: prod
      tag: ${{ inputs.tag || needs.vars.outputs.pr }}

  promote:
    name: Promote Images
    needs: [deploy-prod, vars]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend-java, backend-py, migrations-py]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.pr }}
          tags: prod
