name: .Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      db_password:
        description: Database password (required except on pull_request)
        required: false
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    steps:
      - name: Database password
        id: db
        env:
          EVENT_NAME: ${{ github.event_name }}
          DB_PASSWORD: ${{ secrets.db_password }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            password="$(openssl rand -hex 16)"
            if [ -z "${password}" ]; then
              echo "::error::openssl failed to generate a PR database password"
              exit 1
            fi
          else
            if [ -z "${DB_PASSWORD}" ]; then
              echo "::error::db_password GitHub secret is required for ${EVENT_NAME} deploys"
              exit 1
            fi
            password="${DB_PASSWORD}"
          fi
          echo "::add-mask::${password}"
          echo "password=${password}" >> "${GITHUB_OUTPUT}"
      - uses: bcgov/actions-openshift/deployer@75454b2b33edf37135f6f167775c77a3414207f6 # v0.3.0
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Secret + NetworkPolicies: create if missing. Postgres ignores
          # POSTGRES_PASSWORD after first boot; restamping the Secret desyncs Flyway.
          # New NetworkPolicy names still apply; existing NP specs do not update.
          overwrite: false
          parameters: -p DB_PASSWORD="${{ steps.db.outputs.password }}"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [database, backend-java, backend-py]
        include:
          - name: database
            file: common/openshift.database.yml
            overwrite: false
            parameters: -p DB_PVC_SIZE="256Mi"
          - name: backend-java
            file: backend-java/openshift.deploy.yml
            overwrite: true
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
          - name: backend-py
            file: backend-py/openshift.deploy.yml
            overwrite: true
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/actions-openshift/deployer@75454b2b33edf37135f6f167775c77a3414207f6 # v0.3.0
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: ${{ matrix.overwrite }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}
